<!doctype html>
<html lang="lv">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Atmiņas kāršu spēle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, Segoe UI, Roboto, Arial;
            background: linear-gradient(to bottom, #0f172a, #020617);
            color: #e2e8f0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .navbar a {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }

        .navbar a:hover {
            color: #ffffff;
        }

        .navbar h1 {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
        }

        .game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 12px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 8px;
        }

        .buttons {
            display: flex;
            gap: 8px;
        }

        .info {
            display: flex;
            gap: 16px;
            font-size: 12px;
        }

        .info-item {
            text-align: center;
        }

        .info-label {
            color: #94a3b8;
        }

        .info-value {
            font-size: 18px;
            font-weight: bold;
            margin-top: 4px;
        }

        .timer {
            color: #fb923c;
        }

        .moves {
            color: #3b82f6;
        }

        .pairs {
            color: #10b981;
        }

        .board-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1;
        }

        .card {
            aspect-ratio: 1;
            border-radius: 8px;
            background: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            cursor: pointer;
            user-select: none;
            transition: all 0.18s;
            border: none;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card.flipped {
            background: #2563eb;
        }

        #msg {
            text-align: center;
            color: #ffffff;
            font-size: 14px;
        }

        button {
            background: #059669;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background: #047857;
        }
    </style>
</head>

<body>
    <div class="navbar">
        <a href="/">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
            </svg>
            <span>Atpakaļ</span>
        </a>
        <h1>🃏 Atmiņas spēle</h1>
        <div style="width: 80px;"></div>
    </div>

    <div class="game-area">
        <p class="subtitle">Atrodi visas pāra kārtis!</p>

        <div class="controls">
            <div class="buttons">
                <button id="start">Sākt</button>
                <button id="restart">Atjaunot</button>
            </div>
            <div class="info">
                <div class="info-item">
                    <div class="info-label">Laiks</div>
                    <div class="info-value timer" id="timer">0s</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Gājieni</div>
                    <div class="info-value moves" id="moves">0</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Pāra</div>
                    <div class="info-value pairs" id="pairs">8</div>
                </div>
            </div>
        </div>

        <div class="board-container">
            <div id="board" class="board"></div>
        </div>

        <div id="msg"></div>
    </div>

    <script>
        (function () {
            const EMOJIS = ['🐶', '🐱', '🦊', '🐼', '🐵', '🦁', '🐸', '🐨'];
            const boardEl = document.getElementById('board');
            const startBtn = document.getElementById('start');
            const restartBtn = document.getElementById('restart');
            const timerEl = document.getElementById('timer');
            const movesEl = document.getElementById('moves');
            const pairsEl = document.getElementById('pairs');
            const msgEl = document.getElementById('msg');

            let deck = [];
            let first = null;
            let second = null;
            let lock = false;
            let matched = 0;
            let moves = 0;
            let time = 0;
            let tick = null;

            function build() {
                deck = EMOJIS.concat(EMOJIS).map((v, i) => ({ id: i, val: v, found: false }));
                shuffle(deck);
            }

            function shuffle(a) {
                for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]] }
            }

            function render() {
                boardEl.innerHTML = '';
                deck.forEach((c, idx) => {
                    const b = document.createElement('div');
                    b.className = 'card';
                    b.dataset.idx = idx;
                    b.innerHTML = '<span style="display:flex;align-items:center;justify-content:center">?</span>';
                    b.addEventListener('click', onClick);
                    boardEl.appendChild(b);
                });
            }

            function onClick(e) {
                if (lock) return;
                const el = e.currentTarget;
                const i = Number(el.dataset.idx);
                const card = deck[i];
                if (card.found) return;
                if (el === first) return;

                flip(el, card.val);

                if (!first) { first = el; return; }
                second = el;
                moves++;
                movesEl.textContent = moves;

                const i1 = Number(first.dataset.idx), i2 = Number(second.dataset.idx);
                if (deck[i1].val === deck[i2].val) {
                    deck[i1].found = deck[i2].found = true;
                    matched++;
                    pairsEl.textContent = EMOJIS.length - matched;
                    resetTurn(true);
                    if (matched === EMOJIS.length) end();
                } else {
                    lock = true;
                    setTimeout(() => {
                        unflip(first);
                        unflip(second);
                        resetTurn(false);
                    }, 700);
                }
            }

            function flip(el, val) { el.classList.add('flipped'); el.innerHTML = '<span style="display:flex;align-items:center;justify-content:center;font-size:50px">' + val + '</span>'; }
            function unflip(el) { el.classList.remove('flipped'); el.innerHTML = '<span style="display:flex;align-items:center;justify-content:center">?</span>'; }
            function resetTurn(found) { first = null; second = null; lock = false; }

            function start() {
                build(); render(); matched = 0; moves = 0; time = 0; pairsEl.textContent = EMOJIS.length; movesEl.textContent = '0'; timerEl.textContent = '0s'; msgEl.textContent = '';
                clearInterval(tick); tick = setInterval(() => { time++; timerEl.textContent = time + 's' }, 1000);
            }

            function end() { clearInterval(tick); msgEl.innerHTML = `<div style="color:#10b981">Apsveicu! Atradi visus pārus: <strong>${moves}</strong> gājienos, <strong>${time}s</strong>.</div>`; }

            function restart() { clearInterval(tick); start(); }

            startBtn.addEventListener('click', start);
            restartBtn.addEventListener('click', restart);

            build(); render(); pairsEl.textContent = EMOJIS.length;
        })();
    </script>
</body>

</html>
